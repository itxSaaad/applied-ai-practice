name: Course 1 | Quality and Evaluation

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_provider_evaluations:
        description: Run the live ADK trajectory evaluation (requires GOOGLE_API_KEY).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: course1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    name: Offline quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up system Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Synchronize the project environment
        run: uv sync --extra dev

      - name: Compile the course modules
        run: uv run --no-sync python -m compileall -q utils config.py llm.py run_all.py day1_foundations day2_langchain day3_langgraph day4_adk day5_observability data evals

      - name: Run offline tests
        run: uv run --no-sync python -m pytest -m "not integration" -q

      - name: Write per-day acceptance ledger
        run: uv run --no-sync python run_all.py

      - name: Run the offline evaluation gate
        run: uv run --no-sync python -m day5_observability.pattern5_ci_gate --limit 10

      - name: Upload local run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course1-evidence-${{ matrix.os }}
          path: |
            artifacts/logs/
            artifacts/benchmarks/eval_summary.json
          if-no-files-found: warn
          retention-days: 14

  provider-evaluation:
    name: Provider-backed ADK trajectory evaluation
    if: github.event_name == 'workflow_dispatch' && inputs.run_provider_evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up system Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Synchronize the project environment
        run: uv sync --extra dev

      - name: Require the configured provider credential
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run --no-sync python -c "import config; raise SystemExit(0 if config.GOOGLE_API_KEY else 'GOOGLE_API_KEY is required for provider evaluation')"

      - name: Run the live trajectory test
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: uv run --no-sync python -m pytest -m integration -q evals/test_trajectories.py
