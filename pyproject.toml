# ── Project metadata ─────────────────────────────────────────────────────────
[project]
name = "applied-ai-practice"
version = "0.1.0"
description = "Applied AI & Agentic Engineering Practice - Course 1, Days 1 to 5"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Muhammad Saad Faisal", email = "saadfaisal.dev@gmail.com" },
]
dependencies = [
    "langchain>=1.4,<1.5",
    "langchain-core>=1.7,<1.8",
    "langchain-community>=0.4,<1",
    "langchain-text-splitters>=1.0,<2",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-google-genai>=4.4,<4.5",
    "langchain-ollama>=1.1,<1.2",
    "langsmith>=0.14,<0.15",
    "langfuse>=5.2,<6",
    "openevals>=0.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "openinference-instrumentation-google-adk>=0.1",
    "google-adk>=2.14,<3",
    "chromadb>=1.5",
    "fastapi>=0.160",
    "uvicorn>=0.50",
    "pydantic>=2.14",
    "pytest>=9.0",
    "python-dotenv>=1.2",
    "numpy>=2.0",
    "httpx>=0.28",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]",
    "google-adk[eval]>=2.13",
    "pytest-asyncio>=0.24",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.5",
]

# ── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "llm"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "capstone*",
    "utils*",
    "day1_foundations*",
    "day2_langchain*",
    "day3_langgraph*",
    "day4_adk*",
    "day5_observability*",
    "data*",
]

# ── Formatting: Black ────────────────────────────────────────────────────────
[tool.black]
line-length = 120
target-version = ["py312"]

# ── Import sorting: isort (Black-compatible) ─────────────────────────────────
[tool.isort]
profile = "black"
line_length = 120

# ── Linting: Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "C90",                # mccabe complexity
    "I",                  # isort (ruff's built-in import sorter)
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # flake8-bugbear
    "A",                  # flake8-builtins
    "C4",                 # flake8-comprehensions
    "DTZ",                # flake8-datetimez
    "EM",                 # flake8-errmsg
    "PIE",                # flake8-pie
    "PT",                 # flake8-pytest-style
    "RET",                # flake8-return
    "SIM",                # flake8-simplify
    "SLF",                # flake8-self
    "TCH",                # flake8-type-checking
    "TID",                # flake8-tidy-imports
    "YTT",                # flake8-2020
]
ignore = [
    "E501",               # line-too-long (Black handles this)
    "E402",               # module-level-import-not-at-top (needed for config bootstrap)
    "EM101",              # allow string literals directly in raise Exception("...")
    "EM102",              # allow f-strings directly in raise Exception(f"...")
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"config.py" = ["F401"]    # compatibility re-exports from utils.logging / utils.telemetry

# ── Testing: pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a configured model provider or remote service",
]
