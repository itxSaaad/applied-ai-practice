[project]
name = "applied-ai-practice"
version = "0.1.0"
description = "Applied AI & Agentic Engineering Practice - Milestones 1 to 5 and OpsPilot Capstone"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Muhammad Saad Faisal", email = "saadfaisal.dev@gmail.com" }
]
dependencies = [
    "langchain>=1.4,<1.5",
    "langchain-core>=1.7,<1.8",
    "langgraph>=1.2,<1.3",
    "langchain-google-genai>=4.4,<4.5",
    "langchain-ollama>=1.1,<1.2",
    "langsmith>=0.14,<0.15",
    "langfuse>=5.0",
    "google-adk>=2.13",
    "chromadb>=1.5",
    "fastapi>=0.160",
    "uvicorn>=0.50",
    "pydantic>=2.14",
    "pytest>=9.0",
    "python-dotenv>=1.2",
    "numpy>=2.0",
    "httpx>=0.28",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]",
    "google-adk[eval]>=2.13",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "day1_foundations*",
    "day2_langchain*",
    "day3_langgraph*",
    "day4_adk*",
    "day5_observability*",
    "capstone*",
    "evals*",
]
